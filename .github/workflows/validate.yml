name: Validate exact site generator
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  exact-output:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Fetch official verified practice kit
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/site-kit"
          curl --fail --location --retry 3 --max-time 120 https://make.fun/c/site-generator-speed-01-run-20261122/kit -o "$RUNNER_TEMP/site-kit/kit.tar.gz"
          tar -xzf "$RUNNER_TEMP/site-kit/kit.tar.gz" -C "$RUNNER_TEMP/site-kit"
      - name: Verify kit, exact output and deterministic driver
        run: node .github/ci-verify.mjs "$RUNNER_TEMP/site-kit/site-generator-speed-01-run-20261122-kit"
      - name: Run official container grader
        run: node "$RUNNER_TEMP/site-kit/site-generator-speed-01-run-20261122-kit/cli/makefun.mjs" grade-local --kit "$RUNNER_TEMP/site-kit/site-generator-speed-01-run-20261122-kit" --bot "$GITHUB_WORKSPACE" --driver docker
